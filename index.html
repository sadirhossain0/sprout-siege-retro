:root { --bg: #101418; color-scheme: dark; }
html { box-sizing: border-box; height: 100%; background: var(--bg); }
body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
canvas#pix { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
canvas#game { position: fixed; inset: 0; z-index: 1; display: block; width: 100%; height: 100%; touch-action: none; outline: none; background: transparent; }
#crt { position: fixed; z-index: 2; pointer-events: none; display: none;
  background-image: linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 60%, rgba(0,0,0,.15) 60%, rgba(0,0,0,.15) 100%);
  box-shadow: inset 0 0 90px rgba(0,0,0,.45); }
.ss-modal { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(10,12,16,.7); font-family: "Pixelify Sans", ui-monospace, monospace; -webkit-user-select: text; user-select: text; }
.ss-card { position: relative; width: min(560px, 100%); max-height: 100%; overflow-y: auto; box-sizing: border-box; padding: 20px 24px; border-radius: 0; background: #fff8e8; color: #3a2a1e; border: 6px solid #3a2a1e; box-shadow: 8px 8px 0 rgba(0,0,0,.4); }
.ss-card h2 { margin: 0 0 6px; font: 700 28px "Pixelify Sans", ui-monospace, monospace; color: #2a5a2a; }
.ss-card h3 { margin: 18px 0 4px; font: 700 20px "Pixelify Sans", ui-monospace, monospace; color: #a02828; }
.ss-card p { margin: 6px 0 10px; font-size: 16px; line-height: 1.4; }
.ss-card label { display: block; margin: 8px 0; font-weight: 700; font-size: 15px; }
.ss-card input { display: block; width: 100%; box-sizing: border-box; margin-top: 4px; padding: 10px 12px; font: 400 17px "Pixelify Sans", ui-monospace, monospace; color: #3a2a1e; background: #fff; border: 3px solid #3a2a1e; border-radius: 0; }
.ss-card input:focus { outline: 3px solid #4fa83a; }

  zMitten(ba[0], ba[1], skinD, armA - Math.PI, 7.5 * b);

  if (L.onTorso) L.onTorso(s, b);

/* ---------- update ---------- */
function updateGame(dt) {
  if (G.state === 'intro') {
    G.introT += dt;
    if (G.introT > 2.6) { G.state = 'play'; }
    return;
  }
  if (G.state === 'lost') {
    G.endT += dt;
    for (const b of G.bugs) if (b === G.loser) { b.x -= b.speed * dt * 0.6; b.walk += dt * 6; }
    updateParts(dt);
    if (G.endT > 2.6 && !UI.overlay) { UI.overlay = 'lose'; }
    return;
  }
  G.time += dt;
  G.shake = Math.max(0, G.shake - dt * 40);
  if (G.msg) G.msg.t += dt;
  G.dewBump = Math.max(0, G.dewBump - dt * 4);
  for (const c of G.cards) {
    const was = c.cd;
    c.cd = Math.max(0, c.cd - dt);
    c.flash = Math.max(0, (c.flash || 0) - dt);
    if (was > 0 && c.cd === 0) { c.flash = 0.7; if (canAfford(c)) Snd.play('ready'); }
  }
  updateCritters(dt);

  // sky dew
  G.skyT -= dt;
  if (G.skyT <= 0 && G.state === 'play' && !G.holdWaves) {
    spawnDrop(rand(GX + 50, GX + COLS * CW - 50), -30, false);
    G.skyT = ({ dusk: rand(15, 19), night: rand(22, 28), beach: rand(6, 8) }[G.theme] || rand(8.5, 11.5)) * (G.weather === 'rain' ? 0.7 : 1) * (G.L.twist === 'poor' ? 1.5 : 1);
    if (G.theme === 'beach') G.drops[G.drops.length - 1].life = 5;
  }
  // orchard twist: apples worth 50 dew fall from the trees
  if (G.theme === 'autumn' && G.state === 'play' && !G.holdWaves) {
    G.appleT -= dt;
    if (G.appleT <= 0) { const d = spawnDrop(rand(GX + 50, GX + COLS * CW - 50), -30, false); d.value = 50; d.kind = 'apple'; d.vy = 110; G.appleT = rand(17, 24); }
  }

  updateWeather(dt);
  // waves
  if (G.state === 'play' && !G.holdWaves) {
    const allSpawned = G.wave >= G.totalWaves;
    if (!allSpawned) {
      G.waveTimer -= dt; G.sinceWave += dt;
      let alive = 0;
      for (const b of G.bugs) if (!b.dying) alive += Math.max(0, b.hp) + b.armor;
      for (const q of G.spawnQ) alive += BUGS[q.type].hp;
      if (G.wave > 0 && G.sinceWave > 9 && alive < G.waveHP * 0.3) G.waveTimer = Math.min(G.waveTimer, 2.5);
      const next = G.endless ? endlessWave(G.wave + 1) : G.waves[G.wave];
      if (G.waveTimer <= 0) {
        const isFinal = !G.endless && G.wave === G.totalWaves - 1;
        if (next.huge && G.warned !== G.wave) {
          G.warned = G.wave; G.waveTimer = 3.6;
          showMsg(isFinal ? 'FINAL HORDE!' : 'A big horde is coming!', { color: isFinal ? '#ff6b4a' : '#ffe14a', size: isFinal ? 84 : 58, dur: 3.2 });
          Snd.play('alarm');
        } else {
          if (G.wave === 0) { showMsg('Here come the zombies!', { size: 56, dur: 2.4 }); Snd.play('wave'); }
          spawnWave(G.wave);
          G.wave++; G.sinceWave = 0;
          G.waveTimer = G.L.interval || 25;
        }
      }
    } else if (!G.endless && G.spawnQ.length === 0 && !G.bugs.some(liveBug)) {
      G.state = 'won';
      const rw = rewardOf(G.idx);
      G.reward = { x: G.lastDeath.x, y: G.lastDeath.y - 50, t: 0, type: rw, taken: false, ct: 0 };
      Snd.play('reward');
    }
  }
  // spawn queue
  for (let i = G.spawnQ.length - 1; i >= 0; i--) {
    const q = G.spawnQ[i]; q.delay -= dt;
    if (q.delay <= 0) {
      spawnBug(q.type, q.row, q.x); G.spawnQ.splice(i, 1);
      for (let k = 0; k < 6; k++) addPart({ x: W - rand(10, 60), y: rowY(q.row) - rand(10, 70), vx: rand(-120, -40), vy: rand(-80, 20), g: 300, life: 0.8, kind: 'leafp', color: pick(['#4f9a35', '#6db544', '#3d7a2a']), rot: rand(0, 6), vr: rand(-6, 6), size: rand(6, 10) });

    }
  }

  updateBugs(dt);
  updateProjs(dt);
  updateZProjs(dt);
  updateCrows(dt);
  updateDrops(dt);
  updateParts(dt);
  for (const f of G.fires) f.t += dt;
  G.fires = G.fires.filter(f => f.t < 1.1);
  for (const z of G.zapFx) { z.t += dt; if (z.t > 0.9 && G.zappers[z.row] === 'fire') G.zappers[z.row] = 'gone'; }
  G.zapFx = G.zapFx.filter(z => z.t < 1);
  if (G.reward && G.reward.taken) {
    G.reward.ct += dt / 1.7;
    if (G.reward.ct >= 1 && !UI.overlay) { if (G.demo) UI.overlay = 'demoend'; else { UI.overlay = 'win'; completeLevel(); } }
  } else if (G.reward) {
    G.reward.t += dt;
    if (G.reward.t > 12) takeReward();
  }
}

  G.reward.taken = true; G.reward.sx = G.reward.x; G.reward.sy = G.reward.y;

// ambient critters: butterflies (day/beach), fireflies (dusk/night), falling leaves (autumn), snow (winter)

    else {

// weather: rain (more dew, muddy lanes, thunder in the grove) and wind gusts (zombies get blown forward)
function updateWeather(dt) {

  if (G.weather === 'rain') {
    if (Math.random() < dt * 6) addPart({ x: rand(GX, GX + COLS * CW), y: rand(GY + 20, GY + ROWS * CH - 6), kind: 'splash', life: 0.35, size: rand(6, 10), color: 'rgba(220,235,255,.8)' });
    if (G.L.thunder) {
      G.thunderT -= dt;
      if (G.thunderT <= 0) { G.thunder = 1; G.thunderT = rand(10, 16); Snd.play('thunder'); }
    }
  } else if (G.weather === 'wind' && !G.holdWaves) {
    G.gustT -= dt; G.gust = Math.max(0, G.gust - dt);
    if (G.gustT <= 0) { G.gust = 2.6; G.gustT = rand(13, 18); showMsg('Gust of wind!', { size: 40, dur: 1.6, color: '#e6f4ff' }); Snd.play('whoosh'); }
    if (G.gust > 0 && Math.random() < dt * 30) addPart({ x: W + 10, y: rand(GY, GY + ROWS * CH), vx: -rand(700, 900), vy: rand(-20, 20), g: 0, life: 1.6, kind: 'spark', color: 'rgba(255,255,255,.55)' });
  }

// zombie attacks: pumpkin seeds, parka snowballs, rolling barrels, beekeeper bees
function updateZProjs(dt) {
  for (let i = G.zprojs.length - 1; i >= 0; i--) {

    if (z.kind === 'snow') {
      const k = Math.min(1, z.t / z.dur);
      z.x = lerp(z.x0, z.tx, k); z.y = lerp(z.y0, z.ty, k) - Math.sin(k * Math.PI) * 110;
      if (k >= 1) {
        const p = z.target;
        if (p && !p.dead) { stunPlant(p, 2.5, true); hurtPlant(p, 10); }
        burst(z.x, z.y, 12, ['#ffffff', '#dff4ff'], { max: 160, s0: 2, s1: 5 }); Snd.play('ice');
        G.zprojs.splice(i, 1);
      }

    }
    if (z.kind === 'bee') {
      const p = z.target;

      const tx = p.x + Math.sin(z.t * 9) * 10, ty = p.y - 60 + Math.cos(z.t * 11) * 8;

      if (d < 14) { stunPlant(p, 3); addPart({ x: p.x, y: p.y - 96, vy: -30, g: 0, life: 0.9, kind: 'text', text: 'Ouch!', size: 18, color: '#ffd23a' }); Snd.play('sting'); G.zprojs.splice(i, 1); continue; }
      z.x += dx / d * 240 * dt; z.y += dy / d * 240 * dt;

  }
  if (G.state !== 'play' && G.state !== 'won') return;
  for (let i = G.drops.length - 1; i >= 0; i--) {
    const d = G.drops[i];
    if (d.state !== 'fly' && Math.hypot(x - d.x, y - d.y) < 46) { collectDrop(d); return; }
  }
  if (scareCrow(x, y)) return;
  for (let i = 0; i < G.cards.length; i++) {
    if (inRect(x, y, cardRect(i))) { const was = G.sel; selectCard(i); G.drag = G.sel && G.sel !== was ? { from: 'card' } : null; G.pressCard = i; G.pressT = 0; return; }

// Filled in at build time from cloud-config.json ({ "apiKey": "...", "projectId": "..." }); null = cloud save not set up.
const CLOUD_CONFIG = window.SPROUT_CLOUD_CONFIG || null;

/* ---------- progress helpers ---------- */
function progressOf(d) {
  return { unlocked: d.unlocked, done: d.done.slice(), endlessBest: d.endlessBest, tutDone: !!d.tutDone, seenBugs: d.seenBugs.slice(), stars: Object.assign({}, d.stars || {}) };
}
// Never loses progress: keeps the best of both sides.
function mergeProgress(into, other) {
  if (!other) return false;
  const before = JSON.stringify(progressOf(into));
  into.unlocked = Math.min(LEVELS.length, Math.max(into.unlocked || 1, other.unlocked || 1));
  into.done = Array.from(new Set([...(into.done || []), ...(other.done || [])])).filter(i => i >= 0 && i < LEVELS.length).sort((a, b) => a - b);
  into.endlessBest = Math.max(into.endlessBest || 0, other.endlessBest || 0);
  into.tutDone = !!(into.tutDone || other.tutDone);
  into.seenBugs = Array.from(new Set([...(into.seenBugs || []), ...(other.seenBugs || [])])).filter(k => BUGS[k]);
  into.stars = Object.assign({}, into.stars || {});
  for (const k in (other.stars || {})) { const i = +k, n = +other.stars[k]; if (i >= 0 && i < LEVELS.length && n >= 1 && n <= 3) into.stars[i] = Math.max(into.stars[i] || 0, n); }
  return JSON.stringify(progressOf(into)) !== before;
}

/* ---------- save codes: short text that carries your progress to another device ---------- */
const SaveCode = {
  hash(s) { let h = 7; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 1679616; return h.toString(36).padStart(4, '0'); },
  make(d = Save.data) {
    let doneBits = 0n; for (const i of d.done) if (i >= 0 && i < 64) doneBits |= 1n << BigInt(i);
    let seen = 0; BUG_ORDER.forEach((k, i) => { if (d.seenBugs.includes(k)) seen |= 1 << i; });

  read(code) {

    if (!m || this.hash(m[1].toLowerCase()).toUpperCase() !== m[2]) return null;

};

  make() {

      settings: { sfx: d.sfx, music: d.music, autoDew: d.autoDew, tips: d.tips }, loadout: d.loadout || [] }, null, 2);

        endlessBest: Math.max(0, parseInt(p.endlessBest, 10) || 0), tutDone: !!p.tutDone, seenBugs: Array.isArray(p.seenBugs) ? p.seenBugs.filter(k => BUGS[k]) : [], stars: p.stars && typeof p.stars === 'object' ? p.stars : {} };

/* ---------- text wrapping into lines (for typed-out speech) ---------- */
function wrapLines(str, maxW, font) {
  ctx.font = font;
  const out = [];
  for (const para of str.split('\n')) {
    let cur = '';
    for (const w of para.split(' ')) {
      const t = cur ? cur + ' ' + w : w;
      if (ctx.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t;
    }
    out.push(cur);
  }
  return out;
}
function drawTyped(lines, x, y, lh, chars, font, color) {
  ctx.font = font; ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  let left = chars;
  for (let i = 0; i < lines.length && left > 0; i++) {
    ctx.fillText(lines[i].slice(0, Math.max(0, Math.floor(left))), x, y + i * lh);
    left -= lines[i].length + 1;
  }
}
function addRR(x, y, w, h, r) { // add a rounded rect to the current path (no beginPath)
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

/* ---------- Auto: scripted hand cursor + simulated taps (demo, autopilot, videos) ---------- */
const Auto = {
  hand: { x: W + 80, y: H * 0.6, vis: false, press: 0, ripple: -1, rx: 0, ry: 0 },
  runner: null, wait: 0, cond: null, tw: null,
  run(gen) { this.runner = gen; this.wait = 0; this.cond = null; },
  stop() { this.runner = null; this.tw = null; this.hand.vis = false; },
  active() { return !!this.runner; },
  update(dt) {
    const h = this.hand;
    h.press = Math.max(0, h.press - dt * 4);
    if (h.ripple >= 0) { h.ripple += dt * 2.2; if (h.ripple > 1) h.ripple = -1; }
    if (this.tw) {
      const w = this.tw; w.t += dt;
      const tgt = w.target();
      const k = ease(Math.min(1, w.t / w.dur));
      h.x = lerp(w.x0, tgt.x, k) + Math.sin(k * Math.PI) * w.arc; h.y = lerp(w.y0, tgt.y, k) - Math.sin(k * Math.PI) * w.arc * 0.6;
      if (w.t >= w.dur) { h.x = tgt.x; h.y = tgt.y; this.tw = null; }
    }
    if (!this.runner) return;
    if (this.wait > 0) { this.wait -= dt; return; }
    if (this.cond) { if (!this.cond()) return; this.cond = null; }
    for (let guard = 0; guard < 50; guard++) {
      const r = this.runner.next();
      if (r.done) { this.runner = null; return; }
      const v = r.value;
      if (typeof v === 'number') { this.wait = v; return; }
      if (typeof v === 'function') { if (!v()) { this.cond = v; return; } continue; }
      return;
    }
  },
  draw() {
    const h = this.hand;
    if (!h.vis) return;
    if (h.ripple >= 0) drawTapRipple(h.rx, h.ry, h.ripple);
    drawHand(h.x, h.y, 0.85, h.press);
  }
};
function simTap(x, y) {
  Input.sim = true;
  const ox = Input.x, oy = Input.y;
  Input.x = x; Input.y = y;
  const r = UI.hit(x, y);
  if (r) { if (r.onClick) r.onClick(); }
  else { sceneDown(x, y); sceneUp(x, y); }
  Input.x = ox; Input.y = oy;
  Input.sim = false;
}
function* moveHand(target, speed = 1) {
  const h = Auto.hand;
  const tf = typeof target === 'function' ? target : () => target;
  if (!h.vis) { h.vis = true; h.x = Math.min(W + 60, tf().x + 260); h.y = tf().y + 200; }
  const d = Math.hypot(tf().x - h.x, tf().y - h.y);
  Auto.tw = { x0: h.x, y0: h.y, target: tf, t: 0, dur: clamp(d / 900, 0.3, 0.9) / speed, arc: Math.min(40, d * 0.08) };
  yield () => !Auto.tw;
}

  const target = typeof x === 'function' ? x : { x, y };
  yield* moveHand(target, speed);
  yield 0.1;
  const p = typeof target === 'function' ? target() : target;
  const h = Auto.hand; h.press = 1; h.ripple = 0; h.rx = p.x; h.ry = p.y;
  Snd.play('tick');
  simTap(p.x, p.y);
  yield 0.22;
}

/* ---------- Coach: step-by-step tutorial with spotlight, hand and speech bubble ---------- */
const Coach = {
  steps: null, i: 0, t: 0, typed: 0, lines: null, onDone: null, nextRect: null, skipRect: null,

  active() { return !!(this.steps && this.steps[this.i]); },

  next() {

    if (this.i >= this.steps.length) { const d = this.onDone; this.steps = null; this.onDone = null; if (d) d(); return; }
    const s = this.step; if (s.enter) s.enter();

  },
  update(dt) {

    const targets = this.targets();
    // dim everything except the spotlighted targets

const SHOOTERS = ['berry', 'frost', 'thistle', 'rose', 'lobber'];
const DEMO_LEVEL = {

function botPlan() {
  const card = t => G.cards.find(c => c.type === t);
  const ready = t => { const c = card(t); return c && c.cd <= 0 && G.dew >= PLANTS[t].cost; };
  const count = t => countPlants(t);
  const free = (c, r) => G.rows.includes(r) && !G.grid[r][c] && !G.blocked.has(c + ',' + r);
  const rows = G.rows.slice().sort((a, b) => Math.abs(a - 2) - Math.abs(b - 2));
  const threat = r => G.bugs.filter(b => !b.dying && b.row === r && b.x < W - 20);
  const has = (r, types) => G.grid[r].some(p => p && types.includes(p.type));
  const firstFree = (r, cols) => cols.find(c => free(c, r));
  if (ready('gourd')) {
    let best = null;
    for (const r of G.rows) for (let c = 3; c < COLS; c++) {
      if (!free(c, r)) continue;
      const n = G.bugs.filter(b => !b.dying && Math.abs(b.row - r) <= 1 && Math.abs(b.x - cellX(c)) < CW * 1.4).length;
      if (n >= 3 && (!best || n > best.n)) best = { n, c, r };
    }
    if (best) return { type: 'gourd', c: best.c, r: best.r, say: ['gourd', 'Lots of zombies bunched together: time for a Boom Gourd! It blasts a 3x3 area.'] };
  }
  for (const r of rows) if (threat(r).length && !has(r, SHOOTERS) && ready('berry')) { const c = firstFree(r, [1, 2, 3, 4]); if (c != null) return { type: 'berry', c, r, say: ['shoot', 'A zombie is in a row with no shooter, so the bot plants a Berry Blaster there.'] }; }
  const allCovered = rows.every(r => has(r, SHOOTERS));
  const lilyTarget = allCovered ? G.rows.length + 3 : 3;
  if (count('lily') < lilyTarget && ready('lily')) for (const c of [0, 1]) for (const r of rows) if (free(c, r)) return { type: 'lily', c, r, say: ['lily', 'First it plants Dew Lilies at the back. More lilies means more dew for later.'] };
  for (const r of rows) if (!has(r, SHOOTERS) && ready('berry')) { const c = firstFree(r, [2, 3]); if (c != null) return { type: 'berry', c, r, say: ['berry', 'Next, a Berry Blaster in every row so no zombie walks in unopposed.'] }; }
  for (const r of rows) if (threat(r).length >= 2 && G.grid[r].filter(p => p && SHOOTERS.includes(p.type)).length < 2 && ready('berry')) { const c = firstFree(r, [3, 2, 4]); if (c != null) return { type: 'berry', c, r, say: ['busy', 'This row is getting busy, so it adds a second shooter.'] }; }
  for (const r of rows) if (threat(r).some(b => b.armor > 0) && ready('frost') && count('frost') < 3) { const c = firstFree(r, [3, 4, 2]); if (c != null) return { type: 'frost', c, r, say: ['frost', 'Armored zombies coming. Frost Fern slows them down so the blasters get more hits in.'] }; }
  for (const r of rows) if (threat(r).length && !has(r, ['stump']) && ready('stump') && has(r, SHOOTERS)) { const c = firstFree(r, [6, 5]); if (c != null) return { type: 'stump', c, r, say: ['stump', 'A Stumpy out front makes zombies stop and chew while the blasters keep firing.'] }; }
  if (ready('puff')) for (const r of rows) { const b = threat(r).find(b => b.x > cellX(7) + 80); if (b && !has(r, ['puff']) && free(7, r)) return { type: 'puff', c: 7, r, say: ['puff', 'Spore Puff costs only 25. It arms after 12 seconds and bursts on the first zombie.'] }; }
  for (const r of rows) if (G.grid[r].filter(p => p && SHOOTERS.includes(p.type)).length < 2 && ready('berry')) { const c = firstFree(r, [3, 4]); if (c != null) return { type: 'berry', c, r, say: ['berry2', 'With dew to spare, it doubles up the shooters in each row.'] }; }
  return null;
}
function* botPlay(o = {}) {
  const said = new Set(o.said || []);
  const say = (k, text, dur = 5) => { if (o.captions && !said.has(k)) { said.add(k); Caption.show(text, dur); } };
  const t0 = App.t;
  while (G && App.scene === 'play') {
    if (o.until && o.until()) return;
    if (o.time && App.t - t0 > o.time) return;
    if (UI.overlay === 'newbug') { yield 2.2; if (UI.overlay === 'newbug') simTap(640, 612); continue; }
    if (UI.overlay) { yield 0.3; continue; }
    if (G.reward && !G.reward.taken) { say('win', 'Level cleared! Tap the prize to collect it.', 4); yield 1.2; yield* tapAt(() => ({ x: G.reward.x, y: G.reward.y })); yield 1; continue; }
    if (G.state !== 'play') { yield 0.3; continue; }
    if (G.bugs.some(liveBug)) say('zombies', 'Here they come! Zombies walk in from the right, and shooters only hit zombies in their own row.');
    if (G.msg && /horde/i.test(G.msg.text)) say('horde', 'A big horde is coming! The flags on the progress bar warn you ahead of time.');
    if (G.zapFx.length) say('zap', "A zombie reached the end of that row, so its zapper fired. It won't work again in that row!");
    const d = G.drops.find(d => d.state === 'rest' || (d.state === 'fall' && d.y > GY + 30) || (d.state === 'pop' && d.vy > 0));
    if (d) {
      say('dew', 'Tap dew drops whenever you see them. Each one is worth 25 dew.');
      yield* tapAt(() => ({ x: d.x, y: d.y - 8 }), 1.6);
      continue;
    }
    const plan = botPlan();
    if (plan) {
      if (plan.say) say(plan.say[0], plan.say[1]);
      const i = G.cards.findIndex(c => c.type === plan.type);
      const r = cardRect(i);
      yield* tapAt(r.x + r.w / 2, r.y + r.h / 2, 1.5);
      if (G.sel !== plan.type) { yield 0.2; continue; }
      yield* tapAt(cellX(plan.c), GY + plan.r * CH + CH / 2, 1.5);
      yield 0.3;
      continue;
    }
    yield 0.25;
  }
}

function* titleCard(title, sub, dur, outro = false) {

}
function drawCard_(t) {

  ctx.save(); ctx.translate(W / 2, 410); ctx.scale(k, k);

  ctx.restore();
  drawSprig(220, 690, 1.3, t, 1);
}
function* tutorialAutopilot() {
  while (Coach.active()) {
    const s = Coach.step, idx = Coach.i;
    yield s.autoDelay || (0.8 + s.text.length / 24);
    if (Coach.i !== idx || !Coach.active()) continue;
    if (s.next) { yield () => Coach.nextRect; const r = Coach.nextRect; yield* tapAt(r.x + r.w / 2, r.y + r.h / 2); }
    else if (s.auto) {
      const tgt = () => s.auto() || { x: Auto.hand.x, y: Auto.hand.y };
      yield* tapAt(tgt, s.autoDelay ? 1.4 : 1);
    }
    let waited = 0;
    while (Coach.i === idx && Coach.active() && waited < 20) { yield 0.2; waited += 0.2; }
  }
}

   Text is captured during that pass and redrawn on top at full resolution in a pixel font, so it

  { key: 'pocket', name: 'Pocket Gray', mono: true, colors: ['#1c1c1c', '#5a5a5a', '#a8a8a8', '#eeeeee'] },
  { key: 'amber', name: 'Amber Monitor', mono: true, colors: ['#140a00', '#5a3200', '#b06a00', '#ffb43a'] },
  { key: 'sunset', name: 'Sunset 8', colors: ['#1a1028', '#4a2a5a', '#a04a5a', '#e8806a', '#ffc890', '#fff0d0', '#3a6a5a', '#8ac080'] },

    const bg = hexRgb01(cols[0]);

    const b = this.box();
    gl.viewport(Math.round(b.x), Math.round(ph - b.y - b.h), Math.round(b.w), Math.round(b.h));
    gl.bindTexture(gl.TEXTURE_2D, this.tex);

    const flat = new Float32Array(48); cols.forEach((c, i) => flat.set(hexRgb01(c), i * 3));
    gl.uniform3fv(this.u('pal'), flat);
    gl.uniform1f(this.u('n'), cols.length);
    gl.uniform1f(this.u('mono'), pal.mono ? 1 : 0);
    gl.uniform1f(this.u('full'), pal.colors ? 0 : 1);
    gl.uniform1f(this.u('dith'), this.opts.dither ? 1 : 0);
    gl.uniform2f(this.u('low'), this.lw, this.lh);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    return true;
  },
  // map a CSS colour to the nearest palette colour (for the sharp text layer)
  mapColor(c) {
    if (typeof c !== 'string') return c;
    const pal = this.palette(); if (!pal.colors) return c;
    const key = pal.key + c; let v = this.colorCache.get(key);
    if (v) return v;
    const g = this.lowG; const prev = g.fillStyle; g.fillStyle = c; const norm = g.fillStyle; g.fillStyle = prev;
    let r, gg, b, a = 1;
    if (norm[0] === '#') { [r, gg, b] = hexRgb01(norm); }
    else { const m = norm.match(/[\d.]+/g) || [0, 0, 0]; r = m[0] / 255; gg = m[1] / 255; b = m[2] / 255; a = m[3] == null ? 1 : +m[3]; }

      const l = 0.299 * r + 0.587 * gg + 0.114 * b, n = pal.colors.length;
      best = pal.colors[clamp(Math.round(l * (n - 1)), 0, n - 1)];

      let bd = 1e9;
      for (const h of pal.colors) { const [pr, pg, pb] = hexRgb01(h), dd = 0.9 * (r - pr) ** 2 + 1.6 * (gg - pg) ** 2 + 0.5 * (b - pb) ** 2; if (dd < bd) { bd = dd; best = h; } }
    }
    if (a < 1) { const [pr, pg, pb] = hexRgb01(best); best = `rgba(${Math.round(pr * 255)},${Math.round(pg * 255)},${Math.round(pb * 255)},${a})`; }
    if (this.colorCache.size > 600) this.colorCache.clear();

    return best;
  },
  replayText(c) {
    const b = this.box(), k = b.w / this.lw;
    const base = new DOMMatrix([k, 0, 0, k, b.x, b.y]);
    c.save(); c.beginPath(); c.rect(b.x, b.y, b.w, b.h); c.clip();
    for (const r of this.texts) {
      c.setTransform(base.multiply(r.m));
      c.font = r.font; c.textAlign = r.align; c.textBaseline = r.base; c.globalAlpha = r.a;
      if (r.op === 's') { c.lineWidth = r.lw; c.lineJoin = r.join; c.strokeStyle = this.mapColor(r.stroke); r.mw ? c.strokeText(r.s, r.x, r.y, r.mw) : c.strokeText(r.s, r.x, r.y); }
      else { c.fillStyle = this.mapColor(r.fill); r.mw ? c.fillText(r.s, r.x, r.y, r.mw) : c.fillText(r.s, r.x, r.y); }
    }
    c.restore(); c.globalAlpha = 1;
  },
  // scanlines that line up with the pixel rows, plus a soft vignette
  updateCrt() {

    if (!on) { if (el.style.display !== 'none') el.style.display = 'none'; return; }
    const s = View.scale, row = (H * s) / this.lh;
    const css = `display:block;left:${View.ox}px;top:${View.oy}px;width:${W * s}px;height:${H * s}px;background-size:100% ${row}px;`;
    if (el._css !== css) { el._css = css; el.style.cssText = css; }
  }
};

// pixel-pass versions of the engine's render hooks
bgRS = () => Retro.ls;
// Cached sprites (like seed cards) keep their text out of the bitmap and redraw it live,
// so prices and labels end up on the sharp text layer too.
const textState = g => ({ m: g.getTransform(), font: g.font, fill: g.fillStyle, stroke: g.strokeStyle, lw: g.lineWidth, join: g.lineJoin, align: g.textAlign, base: g.textBaseline, a: g.globalAlpha });
const _sprGet = Sprites.get.bind(Sprites);
Sprites.get = function (key, box, drawFn) {
  let rec = null;
  const e = _sprGet(key, box, () => {
    const g = ctx; rec = [];
    g.fillText = (str, x, y, mw) => rec.push(Object.assign({ op: 'f', s: str, x, y, mw }, textState(g)));
    g.strokeText = (str, x, y, mw) => rec.push(Object.assign({ op: 's', s: str, x, y, mw }, textState(g)));
    drawFn();
  });
  if (rec) { e.texts = rec.length ? rec : null; e.rs = this.rs; }
  return e;
};
Sprites.draw = function (e, x, y) {
  ctx.drawImage(e.c, x + e.box.x, y + e.box.y, e.box.w, e.box.h);
  if (!e.texts) return;
  ctx.save();
  const base = ctx.getTransform().translate(x + e.box.x, y + e.box.y).scale(1 / e.rs);
  for (const r of e.texts) {
    ctx.setTransform(base.multiply(r.m));
    ctx.font = r.font; ctx.textAlign = r.align; ctx.textBaseline = r.base; ctx.globalAlpha *= r.a;
    if (r.op === 's') { ctx.lineWidth = r.lw; ctx.lineJoin = r.join; ctx.strokeStyle = r.stroke; ctx.strokeText(r.s, r.x, r.y); }
    else { ctx.fillStyle = r.fill; ctx.fillText(r.s, r.x, r.y); }
  }
  ctx.restore();
};
Sprites.flash = function (e, x, y, a = 0.5) {
  const op = ctx.globalCompositeOperation, ga = ctx.globalAlpha;
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = ga * a;
  ctx.drawImage(e.c, x + e.box.x, y + e.box.y, e.box.w, e.box.h);
  ctx.globalCompositeOperation = op; ctx.globalAlpha = ga;
};
Sprites.setScale = function () { if (Math.abs(this.rs - Retro.ls) > 0.001) { this.map.clear(); this.px = 0; this.rs = Retro.ls; } };
layerHook = name => {
  const covered = !!UI.overlay || !!App.fadeDir;
  if (name === 'scene') Retro.hi = !covered && !(App.scene === 'play' && G && Coach.active());
  else if (name === 'top') Retro.hi = !covered;
  else if (name === 'overlay') Retro.hi = !App.fadeDir;
  else Retro.hi = false;
};
renderFrame = function (t, dt) {
  const g = Retro.lowG;
  setCtx(g);
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1;
  g.fillStyle = '#1c2a12'; g.fillRect(0, 0, Retro.lw, Retro.lh);
  g.setTransform(Retro.lw / W, 0, 0, Retro.lh / H, 0, 0);
  g.save(); g.beginPath(); g.rect(0, 0, W, H); g.clip();
  Retro.texts.length = 0;
  drawAll(t, dt);
  g.restore();
  const c = mainCtx;
  c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, canvas.width, canvas.height);
  if (!Retro.present()) { // no WebGL: plain pixel upscale, full colour
    const b = Retro.box(); c.fillStyle = '#101418'; c.fillRect(0, 0, canvas.width, canvas.height);
    c.imageSmoothingEnabled = false; c.drawImage(Retro.low, b.x, b.y, b.w, b.h);
  }
  setCtx(c);
  Retro.replayText(c);
  UI.flip();
  drawPortraitWarning(c, t);
  Retro.updateCrt();
};

// chiptune: square and triangle waves only, through a 4-bit crusher
WAVE_MAP = { sine: 'triangle', sawtooth: 'square' };
Snd.chain = (c, master, out) => {
  const ws = c.createWaveShaper(), n = 2048, curve = new Float32Array(n), steps = 12;
  for (let i = 0; i < n; i++) { const x = i / (n - 1) * 2 - 1; curve[i] = Math.round(x * steps) / steps; }
  ws.curve = curve;
  const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 7000;
  master.connect(ws); ws.connect(lp); lp.connect(out);
};

/* ---------- Retro Settings screen ---------- */
function cycleRow(id, x, y, w, label, value, onPrev, onNext) {
  rrect(x, y, w, 56, 12); fs('#f6ead0'); st(3);
  text(label, x + 22, y + 29, 24, { fill: '#3b2a14', stroke: false, align: 'left' });
  const vx = x + w - 170;
  roundBtn(id + 'p', vx - 30, y + 28, 20, () => { P(); ctx.moveTo(4, -9); ctx.lineTo(-6, 0); ctx.lineTo(4, 9); st(4, '#fff8e0'); }, () => { Snd.play('click'); onPrev(); });
  text(value, vx + 80, y + 29, 22, { fill: '#2f7a2c', stroke: false });
  roundBtn(id + 'n', vx + 190, y + 28, 20, () => { P(); ctx.moveTo(-4, -9); ctx.lineTo(6, 0); ctx.lineTo(-4, 9); st(4, '#fff8e0'); }, () => { Snd.play('click'); onNext(); });
}
const cyc = (list, cur, step) => list[(list.indexOf(cur) + step + list.length) % list.length];
EXTRA_OVERLAYS.retro = t => {
  const d = Save.data, o = Retro.opts;

  const keys = RETRO_PALETTES.map(p => p.key), pxs = RETRO_PIXELS.map(p => p.key), diffs = ['easy', 'normal', 'hard'];

  cycleRow('r_pal', 370, 130, 540, 'Colors', pal.name, () => setPal(-1), () => setPal(1));
  // palette swatches
  const cols = pal.colors || ['#e3263b', '#ff8a1e', '#ffd23a', '#7fd458', '#3a9a4a', '#5ab0f0', '#2a4a8a', '#8a4ab8', '#fff8e8', '#101418'];
  const sw = Math.min(32, 520 / cols.length);

  cycleRow('r_px', 370, 220, 540, 'Pixel size', `${px.name} ${px.w}x${px.h}`.replace('Classic 427x240', 'Classic'), () => setPx(-1), () => setPx(1));
  toggleRow('r_dith', 370, 288, 540, 'Dithering', o.dither, () => { o.dither = !o.dither; Save.write(); Snd.play('click'); });
  toggleRow('r_crt', 370, 352, 540, 'CRT scanlines', o.crt, () => { o.crt = !o.crt; Save.write(); Snd.play('click'); });
  cycleRow('r_diff', 370, 416, 540, 'Difficulty', { easy: 'Easy', normal: 'Normal', hard: 'Hard' }[d.difficulty || 'normal'], () => setDiff(-1), () => setDiff(1));
  toggleRow('r_shake', 370, 480, 540, 'Screen shake', d.shake !== false, () => { d.shake = d.shake === false; Save.write(); Snd.play('click'); });
  const dn = { easy: 'Zombies are weaker and slower, and you start with more dew.', normal: 'The standard challenge.', hard: 'Zombies are tougher and faster, and you start with less dew.' }[d.difficulty || 'normal'];
  ctx.font = `600 16px ${FONT_B}`; ctx.fillStyle = '#7a5a3a'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(dn, W / 2, 556);
  plankBtn('r_done', 470, 590, 340, 62, 'Done', () => { Snd.play('click'); UI.overlay = 'options'; }, { size: 30, color: '#5aa83a' });
};
OPTIONS_EXTRA = { label: 'Retro Settings', open: () => { UI.overlay = 'retro'; } };
const _back = backAction;
backAction = function () { if (UI.overlay === 'retro') { UI.overlay = 'options'; return true; } return _back.apply(this, arguments); };
